# Docker Compose for the Telegram bot (system info + media downloader).
#
#   cp .env.example .env && nano .env      # set BOT_TOKEN
#   mkdir -p cookies
#   docker compose up -d --build
#   docker compose logs -f
#
# The healthcheck is inherited from the Dockerfile: `python bot.py --health`
# (it inspects the heartbeat written by the job queue every 60 seconds).

name: appbot-telegram

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: appbot-telegram:latest
    container_name: appbot-telegram
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      DATA_DIR: /app/data
    volumes:
      # runtime data (downloaded files are deleted right after sending)
      - appbot_data:/app/data
      # optional cookies: put youtube.txt / instagram.txt / tiktok.txt here
      - ./cookies:/app/cookies:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # give running downloads/uploads time to stop cleanly
    stop_grace_period: 30s

volumes:
  appbot_data: